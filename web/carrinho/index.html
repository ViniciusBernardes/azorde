<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Carrinho do AZORDE Estúdio, com valores ilustrativos." />
    <title>Carrinho — AZORDE Estúdio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css?v=2" />
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <p class="announce">Valores ilustrativos, para demonstrar a loja</p>

    <header class="header">
      <div class="header__bar">
        <a class="brand" href="/" aria-label="AZORDE Estúdio — início">
          <img src="../assets/logo-azorde-estudio.png" width="150" height="42" alt="AZORDE Estúdio" />
        </a>
        <nav class="nav" id="menu" aria-label="Menu principal">
          <ul>
            <li><a href="/">Início</a></li>
            <li><a href="/produtos/">Peças</a></li>
            <li><a href="/#atelie">Ateliê</a></li>
            <li><a href="/#processo">O processo</a></li>
            <li><a href="/#galeria">Galeria</a></li>
            <li><a href="/#contato">Contato</a></li>
          </ul>
        </nav>
        <div class="header__tools">
          <a class="account-link" data-account href="/conta">Conta</a>
          <a class="cart-link" href="/carrinho/" aria-label="Carrinho">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M6 6h15l-1.5 9h-12z" />
              <path d="M6 6 5 3H2" />
              <circle cx="9" cy="20" r="1.2" fill="currentColor" stroke="none" />
              <circle cx="18" cy="20" r="1.2" fill="currentColor" stroke="none" />
            </svg>
            <span class="cart-link__count" data-cart-count hidden>0</span>
          </a>
        </div>
      </div>
    </header>


    <main id="conteudo" class="shop shop--cart">
      <div class="wrap">
        <header class="cart-head">
          <p class="eyebrow">Seu pedido</p>
          <h1 class="section-title section-title--left">Carrinho</h1>
        </header>
        <div class="cart" id="cart"></div>
      </div>
    </main>

    <script src="../js/store.js?v=2" defer></script>
    <script src="../js/account.js?v=2" defer></script>
    <script src="../js/cart-page.js?v=2" defer></script>
    <script src="../js/main.js?v=2" defer></script>
  </body>
</html>
