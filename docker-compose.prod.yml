services:
  web:
    ports:
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/acme:/var/www/acme:ro
      - ./web/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
  backend:
    environment:
      APP_URL: https://azorde.com.br
      SESSION_SECURE_COOKIE: "true"
    volumes:
      - ./backend/bootstrap/app.php:/var/www/html/bootstrap/app.php:ro
      - ./backend/app/Providers/AppServiceProvider.php:/var/www/html/app/Providers/AppServiceProvider.php:ro
