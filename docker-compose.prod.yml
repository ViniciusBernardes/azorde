services:
  mysql:
    ports:
      - "127.0.0.1:3306:3306"
  web:
    ports:
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/acme:/var/www/acme:ro
      - ./web/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
  backend:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://azorde.com.br
      SESSION_SECURE_COOKIE: "true"
